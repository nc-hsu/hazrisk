# Release: on a version tag (e.g. v0.1.0), build and test the distributions,
# publish them to TestPyPI, then, after manual approval, to PyPI.
#
# Publishing uses PyPI trusted publishing (OpenID Connect): no API token is
# stored in the repository. Before the first release, register this workflow
# (file name release.yml) as a trusted publisher on test.pypi.org and pypi.org,
# with the environments `testpypi` and `pypi`, and create those environments in
# the GitHub repository settings, with a required reviewer on `pypi`. Until
# then the publish jobs fail and nothing is uploaded.
name: Release

on:
  push:
    tags: ["v*"]

# Default to read-only; only the publish jobs get the OIDC token permission.
permissions:
  contents: read

jobs:
  # Build once, test what was built, and hand the files to the publish jobs,
  # so exactly the tested files are uploaded.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version in pyproject.toml
        # The version lives only in pyproject.toml (D11); the tag must be
        # "v" followed by exactly that version.
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          fi
          echo "Releasing hazrisk ${version}"
      - name: Install the build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build the sdist and wheel
        run: python -m build
      - name: Check the metadata and README rendering (twine)
        run: python -m twine check --strict dist/*
      - name: Test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl pytest
          mkdir "$RUNNER_TEMP/wheel-test"
          cp -r tests "$RUNNER_TEMP/wheel-test/"
          cd "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest -p no:cacheprovider \
            --import-mode=importlib --doctest-modules tests --pyargs hazrisk
      - name: Store the distributions for the publish jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Publish to TestPyPI first, as a rehearsal of the real upload.
  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/hazrisk/
    permissions:
      id-token: write  # needed for trusted publishing
    steps:
      - name: Fetch the tested distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Publish to PyPI after the TestPyPI upload worked. The `pypi` environment
  # should require a reviewer, so this job waits for manual approval.
  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hazrisk/
    permissions:
      id-token: write  # needed for trusted publishing
    steps:
      - name: Fetch the tested distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
